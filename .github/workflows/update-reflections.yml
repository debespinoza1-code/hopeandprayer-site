name: Update Reflection Site

on:
  push:
    branches:
      - main
    paths:
      - "content/reflections/*.json"

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update reflection files
        run: node scripts/update-reflections.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/today.json content/reflections/index.json sitemap.xml
          git diff --cached --quiet || git commit -m "Update reflection site"
          git push
