backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "reflection_library"
    label: "Reflection Library"
    folder: "content/reflections"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "reflections/{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "MMMM D, YYYY"
        time_format: false

      - label: "Opening"
        name: "opening"
        widget: "string"
        required: false

      - label: "Reflection"
        name: "body"
        widget: "text"

      - label: "Prayer"
        name: "prayer"
        widget: "string"
        required: false

      - label: "Scripture Reference"
        name: "scripture"
        widget: "string"
        required: false

      - label: "Theme"
        name: "theme"
        widget: "string"
        required: false
